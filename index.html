<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>"赤心图迹"红色景点地图</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link
      rel="stylesheet"
      media="screen and (max-width: 512px)"
      href="css/mobile.css"
    />
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />

    <!-- 引入Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- <script src="leaflet.js"></script> -->
    <script src="lib/leaflet.mapCorrection.js"></script>
  </head>

  <body>
    <!-- =========新增搜索框UI========= -->
    <div style="position:absolute; z-index:999; top:12px; left:12px; background:#ffffff; padding:8px; border-radius:6px; box-shadow:0 1px 6px #aaa;">
      <input id="searchInput" placeholder="搜索红色景点，例：乌兰夫纪念馆" onkeydown="if(event.key==='Enter')searchPlace()" style="width:240px;padding:5px;border:1px solid #ccc;border-radius:4px;">
      <button onclick="searchPlace()" style="padding:5px 10px;cursor:pointer;">搜索定位</button>
    </div>

    <div id="map"></div>
    <div id="coordinate-display">经纬度: <span id="coordinates">-</span></div>
    <div id="nearest-points">
      <h4>离你最近的红色景点：</h4>
      <ul id="nearest-points-list"></ul>
    </div>
    <div id="sidebar">
      <div style="font-size: 12px; margin-bottom: 10px; line-height: 1.4">
        <span style="color: gold">★</span> 标星部分为仪光赤心实践队曾去过的地方
      </div>
      <b>省份：</b>
      <select name="location" id="location-nav"></select>
      <ul id="sidebar-list"></ul>
    </div>
    <div id="sidebar-toggle">☰</div>
    <button id="red-sites-refresh" type="button">搜索屏幕中心附近景点</button>

    <!-- 轮播图容器 -->
    <div id="carousel-container">
      <button id="carousel-toggle" type="button">▲收起图片</button>
      <div id="carousel-content" style="display: block">
        <div id="carousel-track">
          <div class="carousel-slide">
            <img src="" alt="" class="carousel-image" />
            <div class="carousel-title"></div>
          </div>
        </div>
        <div id="carousel-controls">
          <button id="carousel-prev" type="button">‹</button>
          <div id="carousel-dots"></div>
          <button id="carousel-next" type="button">›</button>
        </div>
      </div>
    </div>

    <!-- =========搜索功能JS全局脚本========= -->
    <script>
      let searchMarker = null;
      let map;

      // 等待地图对象完成初始化之后
      function waitMapInit(cb) {
        const timer = setInterval(()=>{
          if(window.mapInstance && window.allPoints){
            map = window.mapInstance;
            clearInterval(timer);
            cb();
          }
        },200);
      }

      // 搜索定位函数（全局，给onclick调用）
      async function searchPlace(){
        if(!map){
          alert("地图尚未加载完成，请稍后再试");
          return;
        }
        const name = document.getElementById("searchInput").value.trim();
        if(!name){
          alert("请输入景点名称");
          return;
        }

        // 优先在本地景点库匹配
        const spotList = window.allPoints;
        const findSpot = spotList.find(item=> item.title.includes(name));
        if(findSpot){
          // 移除之前外部搜索的marker
          if(searchMarker !== null){
            map.removeLayer(searchMarker);
            searchMarker = null;
          }
          const lat = findSpot._lat;
          const lng = findSpot._lng;
          map.setView([lat, lng],12,{animate:true});
          const key = `${lat},${lng}`;
          if(window.markersMap[key]){
            window.markersMap[key].openPopup();
          }
          return;
        }

        // 本地库没找到，调用 nominatim 外部地理搜索
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1&countrycodes=cn`;
        try{
          const resp = await fetch(url);
          const result = await resp.json();
          if(result.length <= 0){
            alert("未找到该地点");
            return;
          }
          const lat = Number(result[0].lat);
          const lon = Number(result[0].lon);
          if(searchMarker !== null){
            map.removeLayer(searchMarker);
          }
          map.setView([lat, lon],14);
          searchMarker = L.marker([lat,lon]).addTo(map);
          searchMarker.bindPopup(`<b>${name}</b>`).openPopup();
        }catch(err){
          alert("网络搜索失败，请尝试本地已收录景点");
        }
      }

      waitMapInit(()=>{
        // 地图就绪回调，目前无额外标记
      });
    </script>

    <!-- 原有模块脚本，保持在后面不动 -->
    <script type="text/javascript" src="./config/config.js"></script>
    <script type="module" src="./js/index.js"></script>
    <script type="module" src="./js/navigator.js"></script>
  </body>
</html>
